<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - Graphical Isomorphism Network for PCOD</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    /* Reset & Base */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      text-align: center;
    }

    /* Background Image */
    .bg-image {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: url('https://images.pexels.com/photos/30548311/pexels-photo-30548311.jpeg') no-repeat center center;
      background-size: cover;
      filter: brightness(50%);
      z-index: -2;
    }

    /* Navbar */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 5%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      color: #0ea5e9;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo i { font-size: 1.8rem; }

    .nav {
      display: flex;
      list-style: none;
      gap: 2rem;
      align-items: center;
    }

    .nav li a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      font-size: 1rem;
      padding: 0.5rem 1rem;
      border-radius: 50px;
      transition: all 0.3s ease;
    }

    .nav li a.active,
    .nav li a:hover {
      background: #0ea5e9;
      color: white;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
    }

    .login-btn a {
      background: #0ea5e9;
      color: white;
      padding: 0.6rem 1.6rem;
      border-radius: 50px;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
    }

    .login-btn a:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(14, 165, 233, 0.4);
    }

    /* Hero Section */
    .hero {
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 100px 20px 40px;
      position: relative;
      z-index: 1;
    }

    .register-container {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 8px 30px rgba(14, 165, 233, 0.25);
      text-align: left;
    }

    .register-container h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #fff;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .register-container h1 span {
      color: #0ea5e9;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group input {
      width: 100%;
      padding: 1rem;
      border: 1px solid #0ea5e9;
      border-radius: 10px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 1rem;
      transition: 0.3s ease;
    }

    .form-group input::placeholder {
      color: #cbd5e1;
    }

    .form-group input:focus {
      outline: none;
      background: rgba(255,255,255,0.2);
      border-color: #fff;
    }

    .btn-primary {
      width: 100%;
      background: #0ea5e9;
      color: #fff;
      padding: 1rem;
      border: none;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 25px rgba(14, 165, 233, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(14, 165, 233, 0.4);
    }

    /* Footer */
    footer {
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      color: white;
      position: relative;
      overflow: hidden;
      margin-top: 40px;
    }

    .footer-bottom {
      text-align: center;
      padding: 1rem 5%;
      font-size: 0.9rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .register-container {
        width: 90%;
        padding: 2rem 1.5rem;
      }
      .register-container h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- Background Image -->
  <div class="bg-image"></div>

  <!-- Navbar -->
  <nav>
    <div class="logo">
      <i class="fas fa-brain"></i> GIN-PCOD
    </div>
    <ul class="nav">
      <li><a href="/index2">Home</a></li>
      <li><a href="/about">About</a></li>
      <li><a href="/register" class="active">Register</a></li>
      <li class="login-btn"><a href="/login">Login</a></li>
    </ul>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="register-container">
      <h1 style="font-size: 25px;">Register for <span>Graphical Isomorphism Network for PCOD</span></h1>
      <form method="POST" action="/register">
        <div class="form-group">
          <input type="text" name="name" placeholder="Full Name" required>
        </div>
        <div class="form-group">
          <input type="email" name="email" placeholder="Email Address" required>
        </div>
        <div class="form-group">
          <input type="password" name="password" placeholder="Password" required>
        </div>
        <div class="form-group">
          <input type="password" name="c_password" placeholder="Confirm Password" required>
        </div>
        <button type="submit" class="btn-primary">Register Now <i class="fas fa-arrow-right"></i></button>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="footer-bottom">
      &copy; 2025 Graphical Isomorphism Network for PCOD Prediction & Risk Stratification. All rights reserved.
    </div>
  </footer>

</body>
</html>
